<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipts - FNEBooks</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <h1>FNEBooks Receipts</h1>
  <nav>
    <a href="/upload_receipt.html">Upload</a>
    <a href="/receipts.html">Receipts</a>
    <a href="/receipt_items.html">Receipt Items</a>
    <a href="/categories.html">Categories</a>
    <a href="/accounts.html">Accounts</a>
    <a href="/settings.html">Settings</a>
    <button onclick="logout()">Logout</button>
  </nav>
</header>
<main>
  <div id="message"></div>
  <div class="card">
    <form id="filterForm">
      <div class="grid compact">
        <div><label>Start Date</label><input type="date" name="start_date"></div>
        <div><label>End Date</label><input type="date" name="end_date"></div>
        <div><label>Worker</label><select name="worker_id" id="workerFilter"><option value="">All</option></select></div>
        <div><label>Project</label><select name="project_id" id="projectFilter"><option value="">All</option></select></div>
        <div><label>Expense Category</label><select name="category_id" id="categoryFilter"><option value="">All</option></select></div>
        <div><label>Account</label><select name="account_id" id="accountFilter"><option value="">All</option></select></div>
        <div><label>Store</label><input name="store"></div>
        <div><label>Receipt Number</label><input name="receipt_number"></div>
        <div><label>Payment Method</label><input name="payment_method"></div>
        <div><label>Follow Up</label><select name="follow_up"><option value="">All</option><option>reimburse</option><option>collect</option></select></div>
        <div><label>Corrected</label><select name="corrected"><option value="">All</option><option value="yes">Yes</option><option value="no">No</option></select></div>
        <div><label>Missing Info Only</label><select name="missing_info_only"><option value="">No</option><option value="true">Yes</option></select></div>
        <div><label>Group By</label><select name="group_by"><option value="">No Group</option><option value="project">Project</option><option value="worker">Worker</option><option value="category">General Category</option><option value="detail_category">Detail Category</option><option value="account">Account</option><option value="store">Store</option><option value="payment_method">Payment Method</option><option value="follow_up">Follow Up</option><option value="month">Month</option></select></div>
      </div>
      <br>
      <div class="grid compact">
        <button>Apply Filter</button>
        <button type="button" class="secondary" onclick="clearFilters()">Clear</button>
        <button type="button" class="secondary" onclick="exportCsv()">Export CSV</button>
      </div>
    </form>
  </div>
  <div class="card scroll"><table id="table"></table></div>
</main>

<dialog id="editDialog">
  <div class="dialog-body">
    <h2>Edit Receipt</h2>
    <form id="editForm">
      <input type="hidden" name="id">
      <div class="grid">
        <div><label>Receipt Date</label><input type="date" name="receipt_date"></div>
        <div><label>Receipt Number</label><input name="receipt_number"></div>
        <div><label>Worker</label><select name="worker_id" id="editWorker"><option value="">Missing</option></select></div>
        <div><label>Store</label><input name="store"></div>
        <div><label>Project</label><select name="project_id" id="editProject"><option value="">No project</option></select></div>
        <div><label>Category</label><select name="category_id" id="editCategory"><option value="">Missing</option></select></div>
        <div><label>Subtotal</label><input type="number" step="0.01" name="subtotal"></div>
        <div><label>Tax</label><input type="number" step="0.01" name="tax"></div>
        <div><label>Total</label><input type="number" step="0.01" name="total"></div>
        <div><label>Payment Method</label><input name="payment_method" placeholder="cash, check, or last 4 digits"></div>
        <div><label>Follow Up</label><select name="follow_up"><option value="">Blank</option><option>reimburse</option><option>collect</option></select></div>
      </div>
      <br><label>Note</label><textarea name="note" rows="2"></textarea>
      <br><br><label>Correction Note</label><textarea name="correction_note" rows="2" placeholder="What was corrected?"></textarea>
      <div class="dialog-actions">
        <button type="button" class="secondary" onclick="editDialog.close()">Cancel</button>
        <button>Save Changes</button>
      </div>
    </form>
  </div>
</dialog>

<script src="/common.js"></script>
<script>
let workers = [], projects = [], categories = [], accounts = [];
const filterForm = document.getElementById('filterForm');
const table = document.getElementById('table');
const editDialog = document.getElementById('editDialog');
const editForm = document.getElementById('editForm');

function categoryOptions(rows, selected = '') {
  return rows.map(row => `<option value="${row.id}" ${String(row.id) === String(selected) ? 'selected' : ''}>${escapeHtml(row.display_name)}</option>`).join('');
}
function accountOptions(rows, selected = '') {
  return rows.map(row => `<option value="${row.id}" ${String(row.id) === String(selected) ? 'selected' : ''}>${escapeHtml(row.account_code)} - ${escapeHtml(row.account_name)}</option>`).join('');
}

async function loadLookups() {
  [workers, projects, categories, accounts] = await Promise.all([
    api('/api/lookups/workers'), api('/api/lookups/projects'),
    api('/api/lookups/categories?kind=expense'), api('/api/lookups/accounts?kind=expense')
  ]);
  document.getElementById('workerFilter').innerHTML = '<option value="">All</option>' + optionHtml(workers, 'worker_id', 'name');
  document.getElementById('projectFilter').innerHTML = '<option value="">All</option>' + optionHtml(projects, 'id', 'name');
  document.getElementById('categoryFilter').innerHTML = '<option value="">All</option>' + categoryOptions(categories);
  document.getElementById('accountFilter').innerHTML = '<option value="">All</option>' + accountOptions(accounts);
}

function currentParams() { return formParams(filterForm); }
async function loadReceipts() {
  const data = await api('/api/receipts?' + currentParams().toString());
  if (data.mode === 'grouped') renderGrouped(data.rows);
  else renderList(data.rows);
}
function renderGrouped(rows) {
  table.innerHTML = `<tr><th>Group</th><th>Receipt Count</th><th>Total Tax</th><th>Total Amount</th></tr>` +
    rows.map(row => `<tr><td>${escapeHtml(row.group_value)}</td><td>${row.receipt_count}</td><td>${money(row.total_tax)}</td><td>${money(row.total_amount)}</td></tr>`).join('');
}
function renderList(rows) {
  table.innerHTML = `<tr><th>Date</th><th>Receipt #</th><th>Worker</th><th>Store</th><th>Project</th><th>Category / Account</th><th>Total</th><th>Payment</th><th>Follow Up</th><th>Flags</th><th>Action</th></tr>` +
    rows.map(row => `<tr>
      <td>${dateOnly(row.receipt_date)}</td>
      <td>${escapeHtml(row.receipt_number)}</td>
      <td>${escapeHtml(row.worker_name)}</td>
      <td>${escapeHtml(row.store)}</td>
      <td>${escapeHtml(row.project_name)}</td>
      <td><strong>${escapeHtml(row.category_group)}</strong><br><span class="small">${escapeHtml(row.category_name)}</span><br><span class="small code">${escapeHtml(row.account_code)} ${escapeHtml(row.account_name)}</span></td>
      <td>${money(row.total)}</td>
      <td>${escapeHtml(row.payment_method)}</td>
      <td><select class="inline-select" onchange="updateFollowUp(${row.id}, this.value)"><option value="">Blank</option><option value="reimburse" ${row.follow_up === 'reimburse' ? 'selected' : ''}>reimburse</option><option value="collect" ${row.follow_up === 'collect' ? 'selected' : ''}>collect</option></select></td>
      <td>${row.corrected ? '<span class="flag good">Corrected</span>' : ''}${row.missing_info ? '<span class="flag warning">Missing Info</span>' : ''}</td>
      <td class="row-actions"><button onclick="openEdit(${row.id})">Edit</button><button onclick="viewFile(${row.id})">File</button><button class="danger" onclick="deleteReceipt(${row.id})">Delete</button></td>
    </tr>`).join('');
}

async function openEdit(id) {
  try {
    const row = await api('/api/receipts/' + id);
    editForm.elements.id.value = row.id;
    editForm.elements.receipt_date.value = dateOnly(row.receipt_date);
    editForm.elements.receipt_number.value = row.receipt_number || '';
    document.getElementById('editWorker').innerHTML = '<option value="">Missing</option>' + optionHtml(workers, 'worker_id', 'name', row.worker_id);
    editForm.elements.store.value = row.store || '';
    document.getElementById('editProject').innerHTML = '<option value="">No project</option>' + optionHtml(projects, 'id', 'name', row.project_id);
    document.getElementById('editCategory').innerHTML = '<option value="">Missing</option>' + categoryOptions(categories, row.category_id);
    editForm.elements.subtotal.value = row.subtotal ?? '';
    editForm.elements.tax.value = row.tax ?? '';
    editForm.elements.total.value = row.total ?? '';
    editForm.elements.payment_method.value = row.payment_method || '';
    editForm.elements.follow_up.value = row.follow_up || '';
    editForm.elements.note.value = row.note || '';
    editForm.elements.correction_note.value = row.correction_note || '';
    editDialog.showModal();
  } catch (err) { showPageMessage(err.message, 'error'); }
}

editForm.addEventListener('submit', async event => {
  event.preventDefault();
  try {
    const body = Object.fromEntries(new FormData(event.target));
    const id = body.id;
    delete body.id;
    await api('/api/receipts/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    editDialog.close();
    showPageMessage('Receipt updated.');
    await loadReceipts();
  } catch (err) { showPageMessage(err.message, 'error'); }
});

async function updateFollowUp(id, value) {
  try {
    await api('/api/receipts/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ follow_up: value || null, correction_note: 'Follow Up updated by admin' }) });
    await loadReceipts();
  } catch (err) { showPageMessage(err.message, 'error'); }
}
function viewFile(id) { window.open('/api/receipts/' + id + '/file', '_blank', 'noopener'); }
async function deleteReceipt(id) {
  if (!confirm('Delete this receipt permanently? This also removes its receipt items so account and balance summaries update.')) return;
  try {
    await api('/api/receipts/' + id, { method: 'DELETE' });
    showPageMessage('Receipt deleted. Account and balance summaries will no longer include it.');
    await loadReceipts();
  } catch (err) { showPageMessage(err.message, 'error'); }
}
function clearFilters() { filterForm.reset(); loadReceipts().catch(err => showPageMessage(err.message, 'error')); }
function exportCsv() { window.location.href = '/api/receipts/export.csv?' + currentParams().toString(); }
filterForm.addEventListener('submit', event => { event.preventDefault(); loadReceipts().catch(err => showPageMessage(err.message, 'error')); });
(async function init(){ await ensureAdmin(); await loadLookups(); await loadReceipts(); })().catch(err => showPageMessage(err.message, 'error'));
</script>
</body>
</html>
